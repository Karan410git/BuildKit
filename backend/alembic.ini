# Alembic configuration for BuildKit.
#
# The sqlalchemy.url below is a placeholder. It is overridden at runtime
# by env.py from the centralized settings.database_url value.

[alembic]
script_location = alembic

# sqlalchemy.url is set from settings.database_url in env.py.
# The value here is a fallback placeholder only.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/buildkit

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Max length of characters for the revision field
revision_length = 12

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
