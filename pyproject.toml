[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildkit-cli"
version = "0.1.0"
description = "Command-line foundation for BuildKit projects"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buildkit = "buildkit_cli.cli:main"

[tool.setuptools.packages.find]
where = ["cli"]

[tool.pytest.ini_options]
pythonpath = ["cli"]
